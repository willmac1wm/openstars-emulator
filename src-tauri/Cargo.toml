[package]
name = "openstars-desktop"
version = "0.1.2"
description = "OpenSTARS desktop (offline ATC radar game)"
authors = ["OpenSTARS"]
edition = "2021"
license = "MIT"

[lib]
name = "openstars_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
once_cell = "1"
base64 = "0.22"
hound = "3.5"
# First-launch Whisper weight download (models stay outside the sealed .app).
ureq = { version = "2.12", default-features = true }

# Whisper STT — ggml models (MIT). Metal/Vulkan enabled via features in CI.
whisper-rs = { version = "0.13", default-features = true }

[features]
default = ["whisper"]
whisper = []
# Optional GPU backends — enable in CI per platform:
# metal = ["whisper-rs/metal"]  # Apple Silicon
# vulkan = ["whisper-rs/vulkan"] # Windows/Linux
# cuda = ["whisper-rs/cuda"]     # NVIDIA Windows

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
